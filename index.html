<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First &amp; Advanced Prep</title>
<meta name="description" content="Independent Cambridge B2 First and C1 Advanced Reading &amp; Use of English practice.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="storage-warning" class="banner banner-warning" hidden role="alert"></div>
<div id="update-banner" class="banner banner-update" hidden>
  <span>New version available.</span>
  <button type="button" id="update-reload-btn" class="btn btn-primary btn-small">Reload</button>
</div>

<header class="app-header">
  <div class="app-header-row">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span class="brand-name">First &amp; Advanced Prep</span>
    </a>
    <div class="header-controls">
      <div id="level-switch" class="segmented" role="group" aria-label="Exam level"></div>
      <div id="theme-switch" class="theme-switch" role="group" aria-label="Theme"></div>
    </div>
  </div>
</header>

<div class="app-shell">
  <nav class="side-nav" aria-label="Primary">
    <ul id="side-nav-list"></ul>
  </nav>

  <main id="app" class="app-main" tabindex="-1"></main>
</div>

<nav class="bottom-nav" aria-label="Primary">
  <ul id="bottom-nav-list"></ul>
</nav>

<div id="live-region" aria-live="polite" class="sr-only"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
